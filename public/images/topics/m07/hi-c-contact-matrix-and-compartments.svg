<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <!-- 标题与副标题 -->
  <text x="30" y="32" font-size="16" font-weight="bold" fill="#0f172a">Hi-C 染色质三维构象：接触热图、TAD 绝缘边界与 A/B 区室空间划分</text>
  <text x="30" y="52" font-size="12" fill="#64748b">空间相互作用幂律衰减、Insulation Score 边界探测与特征向量 (PC1) 常/异染色质解卷积</text>

  <!-- 左侧：Hi-C 接触热图与 TAD 结构 (x: 30 ~ 450, y: 70 ~ 430) -->
  <g id="hi-c-heatmap">
    <rect x="30" y="70" width="410" height="360" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="42" y="82" width="170" height="24" rx="4" fill="#fee2e2"/>
    <text x="127" y="98" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">1. Hi-C 接触矩阵与 TAD 边界</text>

    <!-- 热图旋转模拟 (45度三角形热图) -->
    <g transform="translate(60, 120)">
      <!-- 坐标底板 -->
      <polygon points="175,0 350,175 0,175" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      
      <!-- 对角线密集相互作用块 (TAD 1) -->
      <polygon points="50,125 100,175 0,175" fill="#f87171" opacity="0.85"/>
      <polygon points="50,125 75,150 25,150" fill="#dc2626" opacity="0.9"/>
      
      <!-- 相互作用块 (TAD 2) -->
      <polygon points="175,75 250,175 100,175" fill="#ef4444" opacity="0.85"/>
      <polygon points="175,75 210,125 140,125" fill="#b91c1c" opacity="0.95"/>
      
      <!-- 相互作用块 (TAD 3) -->
      <polygon points="300,125 350,175 250,175" fill="#f87171" opacity="0.85"/>

      <!-- 环状结合点 (Chromatin Loop, 强点状相互作用) -->
      <circle cx="175" cy="80" r="5" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
      <text x="185" y="75" font-size="8" fill="#a16207" font-weight="bold">远距离染色质环 (Loop)</text>

      <!-- 线性染色体坐标轴 -->
      <line x1="0" y1="180" x2="350" y2="180" stroke="#0f172a" stroke-width="2"/>
      <text x="175" y="195" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="bold">染色体线性物理坐标 (Mb)</text>
    </g>

    <!-- 绝缘得分曲线 (Insulation Score, 谷底代表 TAD 边界) -->
    <g transform="translate(60, 325)">
      <text x="0" y="0" font-size="10" font-weight="bold" fill="#0f172a">绝缘得分（Insulation Score）与边界判定：</text>
      <line x1="0" y1="40" x2="350" y2="40" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
      
      <!-- 曲线波形：在 TAD 1 与 2 之间 (x=100) 和 TAD 2 与 3 之间 (x=250) 形成深谷 -->
      <path d="M 0 20 Q 50 15 80 25 L 100 55 L 120 25 Q 175 10 230 25 L 250 55 L 270 25 Q 310 15 350 20" fill="none" stroke="#2563eb" stroke-width="2.2"/>
      
      <circle cx="100" cy="55" r="3.5" fill="#dc2626"/>
      <circle cx="250" cy="55" r="3.5" fill="#dc2626"/>

      <text x="100" y="70" font-size="8" fill="#dc2626" font-weight="bold" text-anchor="middle">TAD 边界 1</text>
      <text x="250" y="70" font-size="8" fill="#dc2626" font-weight="bold" text-anchor="middle">TAD 边界 2</text>
      <text x="350" y="35" font-size="8" fill="#2563eb" text-anchor="end">Insulation Dip (谷底)</text>
    </g>

    <text x="50" y="415" font-size="9" fill="#475569">• 边界富集植物 CTCF 类似绝缘因子 (如 TCP, bZIP, TE 边界)</text>
  </g>

  <!-- 右侧：A/B 区室与植物特有三维构象 (x: 460 ~ 890, y: 70 ~ 430) -->
  <g id="compartments-and-rabl">
    <rect x="460" y="70" width="430" height="360" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <rect x="472" y="82" width="180" height="24" rx="4" fill="#dcfce7"/>
    <text x="562" y="98" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">2. A/B 区室划分与植物特异构象</text>

    <!-- A/B 区室特征向量卡片 -->
    <g transform="translate(475, 115)">
      <rect width="400" height="135" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="bold" fill="#15803d">第一主成分特征向量 (PC1 Eigenvector) 符号解卷积：</text>

      <!-- 坐标轴 -->
      <line x1="20" y1="55" x2="380" y2="55" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="380" y="52" font-size="8" fill="#64748b">0 基准线</text>

      <!-- PC1 波动柱状图 -->
      <!-- A 区室 (正值，绿色) -->
      <rect x="40" y="30" width="35" height="25" fill="#22c55e" rx="2"/>
      <rect x="120" y="22" width="45" height="33" fill="#22c55e" rx="2"/>
      <rect x="260" y="25" width="40" height="30" fill="#22c55e" rx="2"/>
      
      <!-- B 区室 (负值，紫褐色) -->
      <rect x="80" y="55" width="35" height="30" fill="#9333ea" rx="2"/>
      <rect x="175" y="55" width="75" height="40" fill="#9333ea" rx="2"/>
      <rect x="310" y="55" width="50" height="32" fill="#9333ea" rx="2"/>

      <text x="57" y="24" font-size="9" fill="#15803d" font-weight="bold" text-anchor="middle">A 区室 (PC1 &gt; 0)</text>
      <text x="212" y="108" font-size="9" fill="#7e22ce" font-weight="bold" text-anchor="middle">B 区室 (PC1 &lt; 0)</text>

      <text x="12" y="125" font-size="8" fill="#475569">A 区室：常染色质、开放高表达、低 DNA 甲基化；B 区室：着丝粒异染色质、转座子富集、高甲基化</text>
    </g>

    <!-- 植物特有三维构象卡片 -->
    <g transform="translate(475, 260)">
      <rect width="400" height="155" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="bold" fill="#0369a1">🌱 植物特有的两大染色质高级折叠模式：</text>

      <g transform="translate(15, 28)">
        <rect width="175" height="85" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
        <text x="10" y="16" font-size="9" font-weight="bold" fill="#0284c7">1. Rabl 极性构象 (小麦/大麦/水稻)</text>
        <text x="10" y="32" font-size="8" fill="#0369a1">• 着丝粒紧密聚集于核膜一极</text>
        <text x="10" y="46" font-size="8" fill="#0369a1">• 端粒分散聚集于核膜相反一极</text>
        <text x="10" y="60" font-size="8" fill="#0369a1">• 染色体臂平行排列呈发卡状</text>
        <text x="10" y="74" font-size="8" fill="#0369a1">• 减数分裂配对与重组的核心基石</text>
      </g>

      <g transform="translate(205, 28)">
        <rect width="180" height="85" rx="4" fill="#fdf4ff" stroke="#f5d0fe" stroke-width="1"/>
        <text x="10" y="16" font-size="9" font-weight="bold" fill="#a21caf">2. 染色质纽浓缩体 (KNOT, 拟南芥)</text>
        <text x="10" y="32" font-size="8" fill="#86198f">• 5 条染色体上的 10 个异染色质岛</text>
        <text x="10" y="46" font-size="8" fill="#86198f">• 在三维核空间紧密相互结合</text>
        <text x="10" y="60" font-size="8" fill="#86198f">• 形成超大浓缩异染色质中心</text>
        <text x="10" y="74" font-size="8" fill="#86198f">• 强力封印分散转座子的转录激活</text>
      </g>

      <text x="15" y="138" font-size="8" fill="#64748b">HiCExplorer 配合 ICE 迭代归一化与 hicFindTADs 是解析植物三维构象的标准工具链。</text>
    </g>
  </g>
</svg>
