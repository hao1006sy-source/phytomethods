<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <!-- 标题与副标题 -->
  <text x="30" y="32" font-size="16" font-weight="bold" fill="#0f172a">ATAC-seq 染色质可及性测序原理与核小体周期性片段分布</text>
  <text x="30" y="52" font-size="12" fill="#64748b">超高活性 Tn5 转座酶偏好性切割、+4/-5 bp 坐标校正与 TSS 空间富集质控评估</text>

  <!-- 左侧：Tn5 空间特异性转座切割机制 (x: 30 ~ 470, y: 70 ~ 430) -->
  <g id="tn5-transposition">
    <rect x="30" y="70" width="440" height="360" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="42" y="82" width="160" height="24" rx="4" fill="#e0e7ff"/>
    <text x="122" y="98" font-size="11" font-weight="bold" fill="#3730a3" text-anchor="middle">1. Tn5 转座酶切割空间机制</text>

    <!-- 封闭染色质 (核小体阻断) -->
    <g transform="translate(45, 115)">
      <rect width="410" height="90" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="bold" fill="#991b1b">A. 浓缩异染色质区（Closed Chromatin）：Tn5 切割受阻</text>
      
      <!-- 核小体八聚体图形串联 -->
      <g transform="translate(20, 28)">
        <!-- 核小体 1 -->
        <circle cx="40" cy="30" r="18" fill="#f87171" stroke="#dc2626" stroke-width="1.5"/>
        <text x="40" y="34" font-size="8" fill="#fff" text-anchor="middle" font-weight="bold">组蛋白八聚体</text>
        <!-- 核小体 2 -->
        <circle cx="110" cy="30" r="18" fill="#f87171" stroke="#dc2626" stroke-width="1.5"/>
        <text x="110" y="34" font-size="8" fill="#fff" text-anchor="middle" font-weight="bold">组蛋白八聚体</text>
        <!-- 核小体 3 -->
        <circle cx="180" cy="30" r="18" fill="#f87171" stroke="#dc2626" stroke-width="1.5"/>
        <text x="180" y="34" font-size="8" fill="#fff" text-anchor="middle" font-weight="bold">组蛋白八聚体</text>

        <!-- 缠绕 DNA 链 -->
        <path d="M 10 30 Q 40 5 75 30 T 145 30 T 215 30" fill="none" stroke="#64748b" stroke-width="2.5"/>
      </g>

      <text x="250" y="48" font-size="9" fill="#7f1d1d" font-weight="bold">• 147 bp DNA 紧密缠绕组蛋白</text>
      <text x="250" y="64" font-size="9" fill="#7f1d1d">• 空间位阻排斥 Tn5 酶结合</text>
    </g>

    <!-- 开放染色质 (NFR 区域，Tn5 优先切入) -->
    <g transform="translate(45, 215)">
      <rect width="410" height="120" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <text x="12" y="18" font-size="10" font-weight="bold" fill="#15803d">B. 开放常染色质区（Nucleosome-Free Region, NFR）：高效转座</text>
      
      <!-- 裸露 DNA 与 Tn5 结合 -->
      <g transform="translate(20, 26)">
        <line x1="10" y1="40" x2="220" y2="40" stroke="#0ea5e9" stroke-width="3"/>
        
        <!-- 转座酶复合体 Tn5 Dimers -->
        <g transform="translate(90, 15)">
          <ellipse cx="20" cy="15" rx="16" ry="12" fill="#22c55e" stroke="#15803d" stroke-width="1.2"/>
          <ellipse cx="36" cy="22" rx="16" ry="12" fill="#16a34a" stroke="#15803d" stroke-width="1.2"/>
          <text x="28" y="22" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">Tn5 转座酶</text>
          <!-- 预载测序接头 -->
          <line x1="5" y1="12" x2="-8" y2="2" stroke="#dc2626" stroke-width="2"/>
          <text x="-12" y="2" font-size="7" fill="#dc2626" font-weight="bold">接头</text>
          <line x1="50" y1="26" x2="65" y2="36" stroke="#dc2626" stroke-width="2"/>
          <text x="68" y="40" font-size="7" fill="#dc2626" font-weight="bold">接头</text>
        </g>
      </g>

      <text x="250" y="44" font-size="9" fill="#14532d" font-weight="bold">• 启动子、增强子与顺式元件</text>
      <text x="250" y="58" font-size="9" fill="#14532d">• 转录因子高亲和力结合位点</text>
      <text x="250" y="74" font-size="9" fill="#2563eb" font-weight="bold">★ +4 / -5 bp 坐标移位校正：</text>
      <text x="250" y="88" font-size="8" fill="#475569">Tn5 切割产生 9-bp 错位切口；</text>
      <text x="250" y="100" font-size="8" fill="#475569">正链 +4 bp，负链 -5 bp 还原真实断裂点。</text>
    </g>

    <!-- 实验提示 -->
    <rect x="45" y="345" width="410" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="55" y="365" font-size="10" font-weight="bold" fill="#0f172a">🌱 植物 ATAC-seq 特殊质控难点：</text>
    <text x="55" y="382" font-size="9" fill="#475569">1. <tspan font-weight="bold" fill="#dc2626">细胞器污染高</tspan>：叶绿体与线粒体 DNA 缺乏核小体保护，极易消耗 30%~70% 测序数据；</text>
    <text x="55" y="398" font-size="9" fill="#475569">2. 必须采用蔗糖密度梯度离心或流式分选纯化完整细胞核 (Intact Nuclei)。</text>
  </g>

  <!-- 右侧：片段长度周期性与 TSS 富集 (x: 490 ~ 890, y: 70 ~ 430) -->
  <g id="atac-quality-curves">
    <rect x="490" y="70" width="400" height="360" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="502" y="82" width="200" height="24" rx="4" fill="#dbeafe"/>
    <text x="602" y="98" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">2. 片段周期性与 TSS 质控特征</text>

    <!-- 曲线图容器 (y: 115 ~ 265) -->
    <rect x="505" y="115" width="370" height="155" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="515" y="132" font-size="10" font-weight="bold" fill="#0f172a">A. 文库片段长度周期性分布 (Fragment Size Distribution)</text>

    <!-- 坐标轴 -->
    <line x1="540" y1="140" x2="540" y2="245" stroke="#94a3b8" stroke-width="1"/>
    <line x1="540" y1="245" x2="860" y2="245" stroke="#94a3b8" stroke-width="1"/>
    <text x="860" y="258" font-size="9" fill="#64748b" text-anchor="end">片段长度 (bp)</text>
    <text x="532" y="195" font-size="9" fill="#64748b" transform="rotate(-90 532 195)" text-anchor="middle">插入丰度</text>

    <!-- X 刻度 -->
    <text x="540" y="255" font-size="8" fill="#64748b" text-anchor="middle">0</text>
    <text x="600" y="255" font-size="8" fill="#64748b" text-anchor="middle">100</text>
    <text x="660" y="255" font-size="8" fill="#64748b" text-anchor="middle">200</text>
    <text x="730" y="255" font-size="8" fill="#64748b" text-anchor="middle">400</text>
    <text x="800" y="255" font-size="8" fill="#64748b" text-anchor="middle">600</text>

    <!-- 片段分布特征曲线 -->
    <path d="M 545 245 C 555 240, 565 150, 580 155 C 595 160, 615 235, 630 230 C 645 225, 660 185, 675 190 C 690 195, 710 235, 725 225 C 735 215, 745 205, 755 215 C 765 225, 785 240, 810 242 T 850 245" fill="none" stroke="#2563eb" stroke-width="2"/>

    <!-- 峰标注 -->
    <text x="580" y="148" font-size="8" fill="#2563eb" font-weight="bold" text-anchor="middle">&lt;100 bp (NFR 峰)</text>
    <text x="675" y="180" font-size="8" fill="#16a34a" font-weight="bold" text-anchor="middle">~200 bp (单核小体)</text>
    <text x="745" y="200" font-size="8" fill="#d97706" font-weight="bold" text-anchor="middle">~400 bp (双核小体)</text>

    <!-- TSS 富集曲线容器 (y: 280 ~ 415) -->
    <rect x="505" y="280" width="370" height="135" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="515" y="298" font-size="10" font-weight="bold" fill="#0f172a">B. 转录起始位点 (TSS) 富集得分 (TSSE Score)</text>

    <!-- TSS 对称峰图 -->
    <line x1="540" y1="395" x2="860" y2="395" stroke="#94a3b8" stroke-width="1"/>
    <text x="700" y="408" font-size="8" fill="#64748b" text-anchor="middle">TSS (0 bp)</text>
    <text x="570" y="408" font-size="8" fill="#64748b" text-anchor="middle">-2 kb</text>
    <text x="830" y="408" font-size="8" fill="#64748b" text-anchor="middle">+2 kb</text>

    <!-- TSS 钟形高耸曲线 -->
    <path d="M 550 395 C 620 395, 670 390, 690 320 C 695 305, 700 305, 705 305 C 710 305, 715 320, 720 390 C 740 395, 790 395, 850 395" fill="none" stroke="#16a34a" stroke-width="2.2"/>
    <circle cx="700" cy="305" r="3" fill="#15803d"/>
    <text x="700" y="322" font-size="9" fill="#15803d" font-weight="bold" text-anchor="middle">TSS 尖锐峰 (TSSE ≥ 8.0)</text>

    <text x="515" y="350" font-size="9" fill="#475569">• TSSE &gt; 8.0：优质样本，启动子完全开放；</text>
    <text x="515" y="365" font-size="9" fill="#475569">• TSSE &lt; 5.0：质量不佳，背景噪音严重；</text>
    <text x="515" y="380" font-size="9" fill="#1d4ed8" font-weight="bold">✓ 结合 MACS3 可精准识别组织特异性 cCRE 调控元件。</text>
  </g>
</svg>
