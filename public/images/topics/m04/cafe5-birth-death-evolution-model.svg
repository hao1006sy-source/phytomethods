<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bg-grad-cafe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="blue-grad-cafe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="purple-grad-cafe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow-cafe" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- 总体画框与标题 -->
  <rect x="15" y="15" width="970" height="490" rx="16" fill="url(#bg-grad-cafe)" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="40" y="48" font-size="18" font-weight="700" fill="#0f172a">CAFE 5 基因家族随机生灭演化概率模型与速率异质性</text>
  <text x="40" y="70" font-size="12" fill="#64748b">基于系统发育超度量树的连续时间马尔可夫链、转移概率矩阵、组装注释误差修正与似然比检验 (LRT)</text>

  <!-- 左板块：系统发育树上的家族演化示意 -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="440" height="380" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow-cafe)" />
    <path d="M 0 12 Q 0 0 12 0 L 428 0 Q 440 0 440 12 L 440 40 L 0 40 Z" fill="#eff6ff" />
    <text x="16" y="26" font-size="14" font-weight="700" fill="#1d4ed8">1. 超度量物种树上的基因家族数量动态</text>

    <!-- 树分支结构 -->
    <g transform="translate(30, 60)">
      <!-- 根部与分支 -->
      <path d="M 10 100 L 80 100 L 80 50 L 180 50 L 180 25 L 260 25 M 180 50 L 180 75 L 260 75 M 80 100 L 80 160 L 260 160" fill="none" stroke="#475569" stroke-width="2.5" />
      
      <!-- 根部祖先数量 -->
      <rect x="0" y="88" width="55" height="24" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1" />
      <text x="27" y="104" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">N=12</text>
      <text x="27" y="125" font-size="9" fill="#64748b" text-anchor="middle">共同祖先</text>

      <!-- 节点 A -->
      <rect x="155" y="38" width="50" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" />
      <text x="180" y="53" font-size="10" font-weight="700" fill="#1e40af" text-anchor="middle">N=18</text>

      <!-- 叶节点与扩张/收缩标签 -->
      <!-- 物种 1：显著扩张 -->
      <rect x="270" y="14" width="130" height="24" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
      <text x="280" y="30" font-size="11" font-weight="700" fill="#15803d">水稻 (O. sativa): 48</text>
      <path d="M 240 25 L 265 25" stroke="#16a34a" stroke-width="2" />
      <text x="320" y="50" font-size="10" font-weight="700" fill="#16a34a">▲ 显著扩张 (p&lt;0.01)</text>

      <!-- 物种 2：正常波动 -->
      <rect x="270" y="64" width="130" height="24" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
      <text x="280" y="80" font-size="11" fill="#334155">玉米 (Z. mays): 22</text>
      <text x="320" y="100" font-size="10" fill="#64748b">中性漂变/微扩</text>

      <!-- 物种 3：显著收缩 -->
      <rect x="270" y="148" width="130" height="24" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
      <text x="280" y="164" font-size="11" font-weight="700" fill="#b91c1c">拟南芥 (A. thaliana): 3</text>
      <text x="320" y="184" font-size="10" font-weight="700" fill="#dc2626">▼ 显著收缩 (p&lt;0.05)</text>

      <!-- 时间刻度轴 t -->
      <line x1="10" y1="210" x2="260" y2="210" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="10" y1="205" x2="10" y2="215" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="80" y1="205" x2="80" y2="215" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="180" y1="205" x2="180" y2="215" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="260" y1="205" x2="260" y2="215" stroke="#94a3b8" stroke-width="1.5" />
      <text x="10" y="228" font-size="9" fill="#64748b" text-anchor="middle">T_root</text>
      <text x="135" y="228" font-size="10" fill="#475569" text-anchor="middle">进化时间分支长度 t (百万年 Ma)</text>
      <text x="260" y="228" font-size="9" fill="#64748b" text-anchor="middle">0 (现在)</text>
    </g>

    <g transform="translate(20, 310)">
      <rect x="0" y="0" width="400" height="55" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="10" y="20" font-size="11" font-weight="700" fill="#1e293b">植物抗病及特化代谢家族特征：</text>
      <text x="10" y="38" font-size="10" fill="#475569">NBS-LRR、RLK、Terpene Synthase 在特定环境驯化谱系中呈现暴发式串联加倍扩增</text>
    </g>
  </g>

  <!-- 右板块：马尔可夫模型、伽马异质性与误差矩阵 -->
  <g transform="translate(505, 95)">
    <rect x="0" y="0" width="455" height="380" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow-cafe)" />
    <path d="M 0 12 Q 0 0 12 0 L 443 0 Q 455 0 455 12 L 455 40 L 0 40 Z" fill="#faf5ff" />
    <text x="16" y="26" font-size="14" font-weight="700" fill="#7e22ce">2. 数学推导与演化速率建模</text>

    <!-- 公式 1：生灭转移概率 -->
    <g transform="translate(18, 55)">
      <rect x="0" y="0" width="420" height="90" rx="8" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1" />
      <text x="14" y="22" font-size="11" font-weight="700" fill="#86198f">生灭过程转移概率 (Birth-Death Transition Probability):</text>
      <text x="14" y="48" font-size="12" font-weight="700" fill="#701a75">P(X_t = c \mid X_0 = s) = \sum_{j=0}^{\min(s,c)} \binom{s}{j} \binom{s+c-j-1}{s-1} \alpha^{s-j} \beta^{c-j} (1-\alpha-\beta)^j</text>
      <text x="14" y="75" font-size="10" fill="#701a75">其中参数 $\alpha, \beta$ 由生灭率 $\lambda$ 与时间跨度 $t$ 解析推导：$\alpha = \beta = \frac{\lambda t}{1 + \lambda t}$ (当 $\lambda = \mu$)</text>
    </g>

    <!-- 公式 2：Gamma 分布异质性 -->
    <g transform="translate(18, 155)">
      <rect x="0" y="0" width="420" height="95" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" />
      <text x="14" y="20" font-size="11" font-weight="700" fill="#5b21b6">速率异质性 (Rate Heterogeneity, Gamma 分布):</text>
      <text x="14" y="40" font-size="10" fill="#4c1d95">单一全局 $\lambda$ 无法解释极端快速扩张家族，采用离散 Gamma 分布拟合：</text>
      <text x="14" y="62" font-size="12" font-weight="700" fill="#6d28d9">f(\lambda; k, \theta) = \frac{\lambda^{k-1} e^{-\lambda/\theta}}{\theta^k \Gamma(k)} \implies 划分为 \; k=4 \; 个离散速率等级</text>
      <text x="14" y="85" font-size="10" fill="#5b21b6">• 通过似然比检验比较 1-λ 模型与 Gamma 模型的显著性差异 (AIC / LRT)</text>
    </g>

    <!-- 阶段 3：误差模型与 LRT 检验 -->
    <g transform="translate(18, 260)">
      <rect x="0" y="0" width="420" height="105" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="20" font-size="11" font-weight="700" fill="#0f172a">组装注释误差控制与显著性判定：</text>
      <text x="14" y="42" font-size="10" fill="#334155"><tspan font-weight="700" fill="#b91c1c">误差模型 (Error Model -e):</tspan> 测序组装缺口导致假性收缩，引入误差转移矩阵 $\epsilon_{ij} = P(Obs=j \mid True=i)$</text>
      <text x="14" y="65" font-size="10" fill="#334155"><tspan font-weight="700" fill="#15803d">似然比检验 (LRT):</tspan> $\Delta = 2(\ln L_1 - \ln L_0) \sim \chi^2(df)$，评估特定分支或家族是否偏离中性生灭率</text>
      <text x="14" y="88" font-size="10" fill="#334155"><tspan font-weight="700" fill="#2563eb">Viterbi 算法:</tspan> 重构系统发育各内部祖先节点的家族基因数，定位爆发分支</text>
    </g>
  </g>
</svg>
