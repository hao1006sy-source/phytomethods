<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .box-highlight { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; rx: 8; }
      .box-blue { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
      .box-purple { fill: #faf5ff; stroke: #a855f7; stroke-width: 1.5; rx: 8; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #475569; }
      .txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #1e293b; }
      .txt-sm { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .txt-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #0f172a; }
      .arrow { stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrowhead); fill: none; }
      .arrow-blue { stroke: #2563eb; stroke-width: 2; marker-end: url(#arrowhead-blue); fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="1000" height="550" class="bg" />

  <!-- 头部大标题 -->
  <text x="30" y="38" class="title">WGCNA 加权基因共表达网络：无标度拓扑、TOM 矩阵与模块-性状关联</text>
  <text x="30" y="60" class="txt-sm">Weighted Gene Co-expression Network Analysis, Scale-free Topology, Topological Overlap &amp; Module-Trait Correlation</text>

  <!-- 左侧: 无标度网络软阈值选择与幂律拓扑 -->
  <g transform="translate(30, 80)">
    <rect width="450" height="440" class="box" />
    <text x="20" y="28" class="subtitle">1. 软阈值选择与无标度网络准则 (Scale-Free Topology)</text>

    <!-- 软阈值选择折线图 (Scale Free Topology Fit R² vs. Soft Threshold β) -->
    <g transform="translate(45, 50)">
      <rect width="360" height="180" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4" />
      <line x1="40" y1="150" x2="340" y2="150" stroke="#475569" stroke-width="1.5" />
      <line x1="40" y1="20" x2="40" y2="150" stroke="#475569" stroke-width="1.5" />
      <text x="190" y="170" class="txt-sm" text-anchor="middle" font-weight="600">软阈值幂指数 (Soft Threshold, β)</text>
      <text x="-85" y="16" class="txt-sm" text-anchor="middle" font-weight="600" transform="rotate(-90 -85 16)">标度拟合 R²</text>

      <!-- 拟合曲线 R² 达到 0.85 阈值红线 -->
      <line x1="40" y1="50" x2="340" y2="50" stroke="#ef4444" stroke-dasharray="3 3" stroke-width="1.5" />
      <text x="345" y="54" class="txt-sm" font-weight="700" fill="#dc2626">R² = 0.85</text>

      <!-- 快速上升饱和曲线 -->
      <path d="M 50 140 Q 90 90 140 55 T 320 40" fill="none" stroke="#2563eb" stroke-width="2.5" />
      <!-- 最优 β = 6 标记点 -->
      <circle cx="140" cy="55" r="5" fill="#dc2626" />
      <line x1="140" y1="55" x2="140" y2="150" stroke="#dc2626" stroke-dasharray="2 2" />
      <text x="140" y="142" class="txt-sm" font-weight="700" fill="#dc2626" text-anchor="middle">β = 6 (最优)</text>
    </g>

    <!-- 软阈值邻接矩阵数学方程 -->
    <g transform="translate(25, 250)">
      <rect width="400" height="170" class="box-blue" />
      <text x="15" y="24" class="txt" font-weight="600" fill="#1d4ed8">连续软加权取代硬截断 (Soft Power Adjacency)</text>
      <text x="15" y="48" class="txt-mono">a_{ij} = |s_{ij}|^β = |cor(x_i, x_j)|^β</text>
      <text x="15" y="74" class="txt-sm">• <tspan font-weight="600">硬截断缺陷</tspan>：若设阈值 0.8，相关度 0.79 变 0、0.81 变 1，造成生物信息剧烈失真</text>
      <text x="15" y="96" class="txt-sm">• <tspan font-weight="600">软阈值优势</tspan>：连续幂函数强烈抑制弱相关技术噪声，强化强相关枢纽信号</text>
      <text x="15" y="118" class="txt-sm">• <tspan font-weight="600">无标度特性</tspan>：节点度服从幂律 $P(k) \sim k^{-\gamma}$，确保网络具备容错性与核心调控 Hub</text>
      <text x="15" y="140" class="txt-sm">• 标度游离拟合度 $R^2 \ge 0.85$ 时锁定的最小 $\beta$ 即为最佳网络构建参数</text>
    </g>
  </g>

  <!-- 右侧: TOM 拓扑重叠矩阵与模块-性状关联热图 -->
  <g transform="translate(510, 80)">
    <rect width="460" height="440" class="box" />
    <text x="20" y="28" class="subtitle">2. TOM 拓扑重叠矩阵与模块-性状关联 (Module-Trait)</text>

    <!-- 模块层次聚类树与颜色条 -->
    <g transform="translate(30, 45)">
      <rect width="400" height="175" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4" />
      <text x="15" y="22" class="txt-sm" font-weight="600">基因分层聚类树与共表达模块颜色分配 (Tree &amp; Color Bands)</text>

      <!-- 聚类树分支图解 -->
      <path d="M 40 90 L 40 40 L 130 40 L 130 90" fill="none" stroke="#475569" stroke-width="1.5" />
      <path d="M 130 40 L 220 30 L 310 40" fill="none" stroke="#475569" stroke-width="1.5" />
      <path d="M 220 90 L 220 40 L 360 40 L 360 90" fill="none" stroke="#475569" stroke-width="1.5" />

      <!-- 色块条 (Module Bands) -->
      <g transform="translate(35, 100)">
        <rect x="0" y="0" width="80" height="22" fill="#06b6d4" />
        <text x="40" y="16" class="txt-mono" fill="#ffffff" text-anchor="middle">Turquoise</text>

        <rect x="85" y="0" width="80" height="22" fill="#3b82f6" />
        <text x="125" y="16" class="txt-mono" fill="#ffffff" text-anchor="middle">Blue</text>

        <rect x="170" y="0" width="80" height="22" fill="#92400e" />
        <text x="210" y="16" class="txt-mono" fill="#ffffff" text-anchor="middle">Brown</text>

        <rect x="255" y="0" width="80" height="22" fill="#eab308" />
        <text x="295" y="16" class="txt-mono" fill="#0f172a" text-anchor="middle">Yellow</text>
      </g>

      <!-- TOM 拓扑重叠方程 -->
      <text x="15" y="150" class="txt-mono" font-size="10px">TOM_{ij} = (l_{ij} + a_{ij}) / [min(k_i, k_j) + 1 - a_{ij}]</text>
      <text x="15" y="166" class="txt-sm">• $l_{ij} = \sum_u a_{iu} a_{uj}$：两基因共享近邻连接强度总和</text>
    </g>

    <!-- 模块-表型关联热图 (Module-Trait Heatmap) -->
    <g transform="translate(30, 235)">
      <rect width="400" height="185" class="box-highlight" />
      <text x="15" y="24" class="txt" font-weight="600" fill="#15803d">模块特征基因 (Module Eigengene, ME) 与农艺性状关联</text>

      <!-- 热图表格 -->
      <g transform="translate(20, 38)">
        <!-- 表头 -->
        <text x="120" y="15" class="txt-sm" font-weight="600">干旱存活率</text>
        <text x="200" y="15" class="txt-sm" font-weight="600">千粒重 (TGW)</text>
        <text x="280" y="15" class="txt-sm" font-weight="600">可溶性糖含量</text>

        <!-- 行 1: ME-Turquoise (强正相关) -->
        <rect x="0" y="25" width="85" height="26" fill="#06b6d4" rx="3" />
        <text x="42" y="42" class="txt-mono" fill="#ffffff" text-anchor="middle">MEturquoise</text>
        <rect x="100" y="25" width="75" height="26" fill="#fee2e2" />
        <text x="137" y="42" class="txt-mono" fill="#b91c1c" text-anchor="middle" font-weight="700">0.82 (1e-6)</text>
        <rect x="180" y="25" width="75" height="26" fill="#f1f5f9" />
        <text x="217" y="42" class="txt-mono" fill="#64748b" text-anchor="middle">0.05 (0.8)</text>
        <rect x="260" y="25" width="75" height="26" fill="#fee2e2" />
        <text x="297" y="42" class="txt-mono" fill="#b91c1c" text-anchor="middle" font-weight="700">0.71 (3e-4)</text>

        <!-- 行 2: ME-Blue (强负相关) -->
        <rect x="0" y="56" width="85" height="26" fill="#3b82f6" rx="3" />
        <text x="42" y="73" class="txt-mono" fill="#ffffff" text-anchor="middle">MEblue</text>
        <rect x="100" y="56" width="75" height="26" fill="#dbeafe" />
        <text x="137" y="73" class="txt-mono" fill="#1d4ed8" text-anchor="middle" font-weight="700">-0.76 (2e-5)</text>
        <rect x="180" y="56" width="75" height="26" fill="#fee2e2" />
        <text x="217" y="73" class="txt-mono" fill="#b91c1c" text-anchor="middle">0.65 (1e-3)</text>
        <rect x="260" y="56" width="75" height="26" fill="#f1f5f9" />
        <text x="297" y="73" class="txt-mono" fill="#64748b" text-anchor="middle">-0.12 (0.4)</text>

        <!-- 行 3: ME-Brown (中性/低相关) -->
        <rect x="0" y="87" width="85" height="26" fill="#92400e" rx="3" />
        <text x="42" y="104" class="txt-mono" fill="#ffffff" text-anchor="middle">MEbrown</text>
        <rect x="100" y="87" width="75" height="26" fill="#f1f5f9" />
        <text x="137" y="104" class="txt-mono" fill="#64748b" text-anchor="middle">0.14 (0.3)</text>
        <rect x="180" y="87" width="75" height="26" fill="#f1f5f9" />
        <text x="217" y="104" class="txt-mono" fill="#64748b" text-anchor="middle">0.08 (0.6)</text>
        <rect x="260" y="87" width="75" height="26" fill="#f1f5f9" />
        <text x="297" y="104" class="txt-mono" fill="#64748b" text-anchor="middle">-0.05 (0.7)</text>
      </g>
      <text x="15" y="172" class="txt-sm">• 锁定 MEturquoise 模块枢纽 Hub 基因作为核心候选抗旱靶标</text>
    </g>
  </g>
</svg>
