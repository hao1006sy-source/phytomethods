<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .box-highlight { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; rx: 8; }
      .box-blue { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
      .box-purple { fill: #faf5ff; stroke: #a855f7; stroke-width: 1.5; rx: 8; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #475569; }
      .txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #1e293b; }
      .txt-sm { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .txt-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #0f172a; }
      .arrow { stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrowhead); fill: none; }
      .arrow-vel { stroke: #0284c7; stroke-width: 2; marker-end: url(#arrowhead-vel); fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-vel" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="1000" height="550" class="bg" />

  <!-- 头部大标题 -->
  <text x="30" y="38" class="title">单细胞流形降维、Leiden 图聚类与 RNA Velocity 动力学矢量场</text>
  <text x="30" y="60" class="txt-sm">scRNA-seq Manifold Dimensionality Reduction, k-NN Graph, Leiden Community Detection &amp; RNA Velocity Vector Field</text>

  <!-- 左侧: 降维与聚类标准计算流水线 (PCA -> k-NN -> Leiden -> UMAP) -->
  <g transform="translate(30, 80)">
    <rect width="450" height="440" class="box" />
    <text x="20" y="28" class="subtitle">1. 降维聚类核心数学模型与流形学习</text>

    <!-- 步骤 1: HVGs + PCA -->
    <g transform="translate(20, 45)">
      <rect width="410" height="75" class="box-blue" />
      <text x="15" y="24" class="txt" font-weight="600" fill="#1d4ed8">A. 高变基因 (HVGs, ~2,000) 与 PCA 截断奇异值分解</text>
      <text x="15" y="46" class="txt-sm">• 均值-方差对数拟合筛选生物异质性基因，过滤技术泊松噪声</text>
      <text x="15" y="64" class="txt-sm">• 奇异值分解 $X = U \Sigma V^T$，投影至前 30~50 维正交特征主成分</text>
    </g>

    <!-- 步骤 2: k-NN 图构建 -->
    <g transform="translate(20, 130)">
      <rect width="410" height="75" class="box" />
      <text x="15" y="24" class="txt" font-weight="600">B. $k$ 最近邻图构建 ($k$-NN Graph, $k \approx 15 \sim 30$)</text>
      <text x="15" y="46" class="txt-sm">• 在低维 PC 空间计算欧氏距离，建立无向加权细胞网络</text>
      <text x="15" y="64" class="txt-sm">• 边权重表征局部细胞流形密度 (UMAP fuzzy simplicial set)</text>
    </g>

    <!-- 步骤 3: Leiden 图聚类 -->
    <g transform="translate(20, 215)">
      <rect width="410" height="75" class="box-highlight" />
      <text x="15" y="24" class="txt" font-weight="600" fill="#15803d">C. Leiden 模块度最大化社团聚类 (Community Detection)</text>
      <text x="15" y="46" class="txt-sm">• 优化 CPM (Constant Potts Model) 质量函数，规避 Louvain 错联孤岛</text>
      <text x="15" y="64" class="txt-sm">• 无需预设聚类数，通过分辨率参数 (resolution) 自适应多尺度划分</text>
    </g>

    <!-- 步骤 4: UMAP 流形投影 -->
    <g transform="translate(20, 300)">
      <rect width="410" height="75" class="box-purple" />
      <text x="15" y="24" class="txt" font-weight="600" fill="#7e22ce">D. UMAP 非线性流形学习与二维空间投影</text>
      <text x="15" y="46" class="txt-sm">• 保持局部拓扑邻近度的同时，最大程度保留全局大尺度结构</text>
      <text x="15" y="64" class="txt-sm">• 相比 t-SNE 具备更强运算扩展性与更忠实的远端分群拓扑间距</text>
    </g>

    <text x="20" y="405" class="txt-mono" fill="#475569">Scanpy 典型流: sc.pp.pca → sc.pp.neighbors → sc.tl.leiden → sc.tl.umap</text>
  </g>

  <!-- 右侧: RNA Velocity 物理模型与细胞发育动力学矢量场 -->
  <g transform="translate(510, 80)">
    <rect width="460" height="440" class="box" />
    <text x="20" y="28" class="subtitle">2. RNA Velocity 动力学模型与分化方向性</text>

    <!-- 速率数学原理 -->
    <g transform="translate(20, 45)">
      <rect width="420" height="95" class="box-blue" />
      <text x="15" y="22" class="txt" font-weight="600" fill="#1d4ed8">未剪接 (u) / 剪接 (s) mRNA 相平面微分方程</text>
      <text x="15" y="45" class="txt-mono">du/dt = α(t) - β·u(t)    (转录与剪切速率)</text>
      <text x="15" y="65" class="txt-mono">ds/dt = β·u(t) - γ·s(t)    (成熟与降解速率)</text>
      <text x="15" y="85" class="txt-sm">• 瞬时速度: $v = ds/dt = \beta u - \gamma s$。$v &gt; 0$ 诱导表达，$v &lt; 0$ 表达关闭</text>
    </g>

    <!-- 模拟 UMAP 空间根尖分化轨迹与速度箭头场 -->
    <g transform="translate(20, 155)">
      <rect width="420" height="260" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="6" />
      <text x="15" y="22" class="txt-sm" font-weight="600">植物根系单细胞分化 UMAP 与流速场 (拟南芥根尖分生组织)</text>

      <!-- 静止中心 / 干细胞 QC (绿色) -->
      <g transform="translate(50, 130)">
        <ellipse cx="40" cy="30" rx="30" ry="25" fill="#dcfce7" stroke="#16a34a" stroke-dasharray="3 3" />
        <circle cx="30" cy="25" r="4" fill="#16a34a" />
        <circle cx="45" cy="20" r="4" fill="#16a34a" />
        <circle cx="38" cy="38" r="4" fill="#16a34a" />
        <text x="40" y="68" class="txt-sm" text-anchor="middle" font-weight="600" fill="#15803d">干细胞源头 (QC)</text>
      </g>

      <!-- 速度场矢量箭头 (从干细胞辐射向各分化亚群) -->
      <!-- 向上分支: 根冠 (Columella) -->
      <path d="M 120 145 Q 150 110 200 90" class="arrow-vel" />
      <path d="M 115 130 Q 145 95 190 75" class="arrow-vel" />
      <!-- 水平分支: 木质部/韧皮部 (Stele) -->
      <path d="M 130 160 Q 180 160 250 160" class="arrow-vel" />
      <path d="M 130 175 Q 185 180 260 185" class="arrow-vel" />
      <!-- 向下分支: 表皮/根毛 (Epidermis) -->
      <path d="M 120 185 Q 150 215 210 230" class="arrow-vel" />
      <path d="M 110 195 Q 140 230 195 245" class="arrow-vel" />

      <!-- 分化亚群 1: 根冠 (紫色) -->
      <g transform="translate(240, 50)">
        <ellipse cx="45" cy="30" rx="40" ry="25" fill="#f3e8ff" stroke="#a855f7" />
        <circle cx="30" cy="25" r="4" fill="#a855f7" />
        <circle cx="55" cy="20" r="4" fill="#a855f7" />
        <circle cx="42" cy="35" r="4" fill="#a855f7" />
        <circle cx="65" cy="32" r="4" fill="#a855f7" />
        <text x="45" y="68" class="txt-sm" text-anchor="middle" font-weight="600" fill="#7e22ce">根冠细胞群 (Columella)</text>
      </g>

      <!-- 分化亚群 2: 中柱与维管束 (蓝色) -->
      <g transform="translate(290, 140)">
        <ellipse cx="50" cy="30" rx="45" ry="25" fill="#dbeafe" stroke="#3b82f6" />
        <circle cx="35" cy="25" r="4" fill="#3b82f6" />
        <circle cx="60" cy="20" r="4" fill="#3b82f6" />
        <circle cx="50" cy="38" r="4" fill="#3b82f6" />
        <circle cx="75" cy="30" r="4" fill="#3b82f6" />
        <text x="50" y="68" class="txt-sm" text-anchor="middle" font-weight="600" fill="#1d4ed8">中柱导管细胞 (Stele/Xylem)</text>
      </g>

      <!-- 分化亚群 3: 表皮与皮层 (橙色) -->
      <g transform="translate(240, 215)">
        <ellipse cx="45" cy="25" rx="40" ry="22" fill="#ffedd5" stroke="#f97316" />
        <circle cx="30" cy="20" r="4" fill="#f97316" />
        <circle cx="55" cy="18" r="4" fill="#f97316" />
        <circle cx="45" cy="32" r="4" fill="#f97316" />
        <text x="45" y="58" class="txt-sm" text-anchor="middle" font-weight="600" fill="#c2410c">表皮/根毛 (Epidermis)</text>
      </g>
    </g>
  </g>
</svg>
