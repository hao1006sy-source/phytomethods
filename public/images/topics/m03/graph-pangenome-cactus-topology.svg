<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <linearGradient id="refGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="invGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">植物变异诱导图拓扑结构与单倍型遍历模型 (Minigraph-Cactus / PGGB)</text>
  <text x="500" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">Variation Graph Topology: Nodes, Directed Edges, Nested Bubbles and Haplotype Paths</text>

  <!-- Main Graph Topology Box -->
  <g transform="translate(50, 90)">
    <rect x="0" y="0" width="900" height="270" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    
    <!-- Sub-header -->
    <text x="25" y="32" fill="#38bdf8" font-size="14" font-weight="700">变异诱导图 (rGFA / GFAv1) 节点与拓扑关系</text>
    <text x="650" y="32" fill="#94a3b8" font-size="12">G = (V, E, P): 节点 V, 有向边 E, 样本单倍型路径 P</text>

    <!-- Backbone Nodes (Reference Genome) -->
    <!-- Node 1 -->
    <g transform="translate(60, 110)">
      <rect x="0" y="0" width="80" height="42" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
      <text x="40" y="25" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Node 1</text>
      <text x="40" y="37" fill="#bae6fd" font-size="9" text-anchor="middle">500 bp [Ref]</text>
    </g>

    <!-- Edge 1 -> 2 (SNP bubble) -->
    <line x1="140" y1="125" x2="200" y2="95" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)" />
    <line x1="140" y1="135" x2="200" y2="165" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)" />

    <!-- Node 2A (Ref Allele) -->
    <g transform="translate(200, 75)">
      <rect x="0" y="0" width="60" height="38" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
      <text x="30" y="22" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Node 2A</text>
      <text x="30" y="33" fill="#bae6fd" font-size="9" text-anchor="middle">SNP: [A]</text>
    </g>

    <!-- Node 2B (Alt Allele) -->
    <g transform="translate(200, 145)">
      <rect x="0" y="0" width="60" height="38" rx="6" fill="#059669" stroke="#34d399" stroke-width="2" />
      <text x="30" y="22" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Node 2B</text>
      <text x="30" y="33" fill="#a7f3d0" font-size="9" text-anchor="middle">SNP: [G]</text>
    </g>

    <!-- Edge 2 -> 3 -->
    <line x1="260" y1="95" x2="310" y2="125" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)" />
    <line x1="260" y1="165" x2="310" y2="135" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)" />

    <!-- Node 3 (Backbone Anchor) -->
    <g transform="translate(310, 110)">
      <rect x="0" y="0" width="75" height="42" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
      <text x="37" y="25" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Node 3</text>
      <text x="37" y="37" fill="#bae6fd" font-size="9" text-anchor="middle">1.2 kb [Ref]</text>
    </g>

    <!-- Edge 3 -> 4 (Insertion Bubble) -->
    <!-- Direct edge (Deletion relative to insert) -->
    <line x1="385" y1="131" x2="520" y2="131" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)" />
    <!-- Loop edge (Novel Sequence Insertion e.g. TE or Novel Gene) -->
    <path d="M 385 120 C 420 50, 485 50, 520 120" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="4,2" />
    <text x="455" y="72" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">非参考特异插入 (+4.8 kb PAV 基因)</text>

    <!-- Node 4 (Backbone Anchor) -->
    <g transform="translate(520, 110)">
      <rect x="0" y="0" width="75" height="42" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
      <text x="37" y="25" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Node 4</text>
      <text x="37" y="37" fill="#bae6fd" font-size="9" text-anchor="middle">800 bp [Ref]</text>
    </g>

    <!-- Edge 4 -> 5 with Inversion Loop -->
    <line x1="595" y1="131" x2="680" y2="131" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)" />
    
    <!-- Node 5 (Inversion Node: forward and reverse complementary edges) -->
    <g transform="translate(680, 110)">
      <rect x="0" y="0" width="85" height="42" rx="6" fill="#d97706" stroke="#fbbf24" stroke-width="2" />
      <text x="42" y="25" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Node 5</text>
      <text x="42" y="37" fill="#fef3c7" font-size="9" text-anchor="middle">倒位块 (Inv 25 kb)</text>
    </g>

    <!-- Inversion feedback path (Node 5 reverse strand) -->
    <path d="M 765 140 C 790 200, 650 210, 680 145" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,3" />
    <text x="735" y="195" fill="#fbbf24" font-size="10" font-weight="600">反向互补边 (-strand)</text>

    <!-- Node 6 (Terminal Backbone) -->
    <line x1="765" y1="131" x2="810" y2="131" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)" />
    <g transform="translate(810, 110)">
      <rect x="0" y="0" width="70" height="42" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
      <text x="35" y="25" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Node 6</text>
      <text x="35" y="37" fill="#bae6fd" font-size="9" text-anchor="middle">2.0 kb [Ref]</text>
    </g>

    <!-- Haplotype Path Legend underneath -->
    <g transform="translate(60, 225)">
      <text x="0" y="15" fill="#e2e8f0" font-size="11" font-weight="700">样本单倍型穿行路径 (Paths):</text>
      <!-- Path 1 (Ref: Nipponbare / B73) -->
      <line x1="170" y1="12" x2="205" y2="12" stroke="#38bdf8" stroke-width="3" />
      <text x="215" y="15" fill="#38bdf8" font-size="11">参考单倍型 P_ref: 1+ → 2A+ → 3+ → 4+ → 5+ → 6+</text>
      
      <!-- Path 2 (Cultivar A) -->
      <line x1="510" y1="12" x2="545" y2="12" stroke="#10b981" stroke-width="3" />
      <text x="555" y="15" fill="#34d399" font-size="11">农艺品种 A: 1+ → 2B+ → 3+ → 4+ → 5- → 6+ (携带倒位)</text>
    </g>
  </g>

  <!-- Bottom Panel: Comparative Evaluation -->
  <g transform="translate(50, 380)">
    <!-- Traditional Linear Reference Limitations -->
    <rect x="0" y="0" width="435" height="110" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.2" />
    <text x="18" y="26" fill="#f87171" font-size="13" font-weight="700">传统单一线性参考基因组局限 (Reference Bias)</text>
    <text x="18" y="48" fill="#cbd5e1" font-size="11">• <tspan fill="#fca5a5">非参考序列完全丢失</tspan>：野生种或异源渗入的大片段缺失 (PAV) 无法映射；</text>
    <text x="18" y="68" fill="#cbd5e1" font-size="11">• <tspan fill="#fca5a5">严重错配与假变异</tspan>：大片段倒位或结构变异区域产生海量假阳性 SNP；</text>
    <text x="18" y="88" fill="#cbd5e1" font-size="11">• <tspan fill="#fca5a5">等位多态性塌缩</tspan>：多倍体同源异型染色体常被折叠，导致育种标记失效。</text>

    <!-- Graph Pangenome Advantages -->
    <rect x="465" y="0" width="435" height="110" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
    <text x="483" y="26" fill="#34d399" font-size="13" font-weight="700">图泛基因组核心优势 (Graph Pangenome Advantages)</text>
    <text x="483" y="48" fill="#cbd5e1" font-size="11">• <tspan fill="#6ee7b7">无偏变异映射 (Unbiased Alignment)</tspan>：所有单倍型的变异与特有片段平等共存；</text>
    <text x="483" y="68" fill="#cbd5e1" font-size="11">• <tspan fill="#6ee7b7">精细结构变异拓扑</tspan>：以气泡（Bubble）和超泡（Snarl）严格界定变异嵌套；</text>
    <text x="483" y="88" fill="#cbd5e1" font-size="11">• <tspan fill="#6ee7b7">长读段与短读段高效基因分型</tspan>：通过 Giraffe/vg 实现群体水平低成本分型。</text>
  </g>
</svg>
