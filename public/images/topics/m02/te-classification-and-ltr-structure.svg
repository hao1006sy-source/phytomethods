<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 17px; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .panel { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 12px; }
      .box { rx: 6px; stroke-width: 1.5; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; dominant-baseline: central; fill: #ffffff; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #334155; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left Panel: Wicker TE Classification -->
  <g transform="translate(24, 24)">
    <rect width="430" height="432" class="panel"/>
    <text x="20" y="32" class="title">A. 植物转座子 (TE) 统一分类层级体系</text>
    <text x="20" y="52" class="subtitle">Wicker et al. (2007) Nature Reviews Genetics 经典分类学</text>

    <g transform="translate(20, 75)">
      <!-- Root -->
      <rect x="0" y="0" width="390" height="34" rx="6" fill="#0f172a"/>
      <text x="195" y="17" class="node-text" font-size="13">全基因组转座子元件 (Transposable Elements)</text>

      <!-- Class I: Retrotransposons -->
      <rect x="0" y="50" width="190" height="32" rx="5" fill="#0284c7"/>
      <text x="95" y="66" class="node-text">Class I: RNA 反转录转座子</text>
      <text x="95" y="94" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#0369a1">“复制—粘贴”机制 (植物主导)</text>

      <!-- Class I Subclasses -->
      <rect x="10" y="110" width="170" height="70" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
      <text x="20" y="130" font-family="sans-serif" font-size="11" font-weight="700" fill="#0284c7">• LTR-RT (长末端重复)</text>
      <text x="32" y="150" font-family="sans-serif" font-size="10" fill="#0369a1">- Gypsy (聚居于着丝粒与异染色质)</text>
      <text x="32" y="166" font-family="sans-serif" font-size="10" fill="#0369a1">- Copia (倾向富集于常染色质基因侧翼)</text>

      <rect x="10" y="190" width="170" height="44" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
      <text x="20" y="210" font-family="sans-serif" font-size="11" font-weight="700" fill="#0284c7">• Non-LTR</text>
      <text x="32" y="226" font-family="sans-serif" font-size="10" fill="#0369a1">- LINE (长散在) / SINE (短散在)</text>

      <!-- Class II: DNA Transposons -->
      <rect x="200" y="50" width="190" height="32" rx="5" fill="#059669"/>
      <text x="295" y="66" class="node-text">Class II: DNA 转座子</text>
      <text x="295" y="94" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#047857">“剪切—粘贴”机制 (TIR / 滚环)</text>

      <!-- Class II Subclasses -->
      <rect x="210" y="110" width="170" height="60" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="220" y="130" font-family="sans-serif" font-size="11" font-weight="700" fill="#059669">• TIR (末端倒位重复)</text>
      <text x="232" y="148" font-family="sans-serif" font-size="10" fill="#065f46">- CACTA, Mutator, hAT, Tc1</text>
      <text x="232" y="162" font-family="sans-serif" font-size="10" fill="#065f46">- MITE (微型反向重复转座元件)</text>

      <rect x="210" y="180" width="170" height="54" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="220" y="200" font-family="sans-serif" font-size="11" font-weight="700" fill="#059669">• Helitron (滚环转座子)</text>
      <text x="232" y="218" font-family="sans-serif" font-size="10" fill="#065f46">- 捕获并扩增宿主基因外显子片段</text>

      <!-- Ratio in Maize note -->
      <g transform="translate(10, 250)">
        <rect width="370" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="14" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">植物大基因组特色数据 (以玉米 B73 为例)：</text>
        <text x="14" y="42" font-family="sans-serif" font-size="10.5" fill="#334155">• <tspan font-weight="600" fill="#0284c7">LTR-RT 占比</tspan>: 约 75%~80% (Gypsy: ~50%, Copia: ~25%)</text>
        <text x="14" y="58" font-family="sans-serif" font-size="10.5" fill="#334155">• <tspan font-weight="600" fill="#059669">TIR + Helitron 占比</tspan>: 约 5%~8%</text>
        <text x="14" y="74" font-family="sans-serif" font-size="10.5" fill="#dc2626">• <tspan font-weight="600" fill="#dc2626">非重复蛋白编码基因</tspan>: 仅占全基因组物理长度的 &lt; 2%</text>
      </g>
    </g>
  </g>

  <!-- Right Panel: Full-length LTR Structure & Insertion Age -->
  <g transform="translate(480, 24)">
    <rect width="456" height="432" class="panel"/>
    <text x="20" y="32" class="title">B. 完整 LTR-RT 物理结构与插入年代计算</text>
    <text x="20" y="52" class="subtitle">两端 LTR 序列分子钟分歧度计算：T = K / (2μ)</text>

    <g transform="translate(25, 80)">
      <!-- LTR-RT Diagram -->
      <!-- TSD Left -->
      <rect x="0" y="40" width="28" height="36" rx="4" fill="#f59e0b"/>
      <text x="14" y="58" class="node-text" font-size="10">TSD</text>

      <!-- 5' LTR -->
      <rect x="32" y="32" width="75" height="52" rx="6" fill="#3b82f6"/>
      <text x="69" y="58" class="node-text">5' LTR</text>
      <text x="69" y="74" class="node-text" font-size="9">TG...CA</text>

      <!-- PBS -->
      <rect x="111" y="44" width="24" height="28" rx="3" fill="#64748b"/>
      <text x="123" y="58" class="node-text" font-size="9">PBS</text>

      <!-- Internal GAG-POL Core -->
      <rect x="139" y="36" width="130" height="44" rx="6" fill="#8b5cf6"/>
      <text x="204" y="54" class="node-text">内部核心区 (Internal)</text>
      <text x="204" y="70" class="node-text" font-size="9.5">GAG - POL (PR, RT, INT)</text>

      <!-- PPT -->
      <rect x="273" y="44" width="24" height="28" rx="3" fill="#64748b"/>
      <text x="285" y="58" class="node-text" font-size="9">PPT</text>

      <!-- 3' LTR -->
      <rect x="301" y="32" width="75" height="52" rx="6" fill="#3b82f6"/>
      <text x="338" y="58" class="node-text">3' LTR</text>
      <text x="338" y="74" class="node-text" font-size="9">TG...CA</text>

      <!-- TSD Right -->
      <rect x="380" y="40" width="28" height="36" rx="4" fill="#f59e0b"/>
      <text x="394" y="58" class="node-text" font-size="10">TSD</text>

      <!-- Structural Labels below -->
      <text x="205" y="105" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">标准完整 LTR 反转录转座子物理构象 (~5 kb 至 15 kb)</text>

      <!-- Mathematical Age Inference Box -->
      <g transform="translate(5, 125)">
        <rect width="395" height="195" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="16" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">插入年代分子钟估算公式 (SanMiguel et al., 1998)：</text>
        
        <rect x="16" y="36" width="363" height="44" rx="5" fill="#ffffff" stroke="#93c5fd"/>
        <text x="197" y="62" text-anchor="middle" font-family="serif" font-size="15" font-weight="700" fill="#1e3a8a">T = K / (2μ)</text>

        <text x="16" y="100" font-family="sans-serif" font-size="11" fill="#334155">• <tspan font-weight="700">原理</tspan>: 插入宿主基因组瞬间，5' LTR 与 3' LTR 序列理论上 100% 同源</text>
        <text x="16" y="118" font-family="sans-serif" font-size="11" fill="#334155">• <tspan font-weight="700">K 值</tspan>: 5' 和 3' LTR 序列利用 Kimura 2-parameter (K2P) 计算的分歧度</text>
        <text x="16" y="136" font-family="sans-serif" font-size="11" fill="#334155">• <tspan font-weight="700">μ (植物中性突变率)</tspan>: 草本单子叶禾本科通常取 1.3 × 10⁻⁸ 次替换/位点/年</text>
        <text x="16" y="154" font-family="sans-serif" font-size="11" fill="#334155">• <tspan font-weight="700">因子 2</tspan>: 代表两侧 LTR 从同一共同祖先序列开始独立独立累积突变</text>
        <text x="16" y="174" font-family="sans-serif" font-size="10.5" fill="#047857" font-weight="600">✔ EDTA 集成 LTR_retriever，自动输出全基因组 LTR 插入年代分布图！</text>
      </g>
    </g>
  </g>
</svg>
