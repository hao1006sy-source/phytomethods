name: Pull Request Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium dependencies
        run: npx playwright install --with-deps chromium

      - name: Validate site, content, search index, and links
        run: npm run validate

      - name: Check tutorial scientific verification records
        run: npm run check:tutorial-science

      - name: Check CAFE5 reproducibility evidence
        run: npm run check:cafe5

      - name: Run platform browser regressions in headless Chromium
        run: npm run test:platform-browser

      - name: Upload browser regression test artifacts and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-browser-test-evidence
          path: outputs/platform-v1-test/
          if-no-files-found: ignore
